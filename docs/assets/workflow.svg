<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline Workflow</title>
  <desc id="desc">High-level pothole analysis flow from input image to dashboard results.</desc>
  <defs>
    <style>
      .title { font: 700 24px Segoe UI, Arial, sans-serif; fill: #e2e8f0; }
      .label { font: 600 16px Segoe UI, Arial, sans-serif; fill: #e2e8f0; }
      .hint { font: 500 13px Segoe UI, Arial, sans-serif; fill: #94a3b8; }
      .arrow { stroke: #38bdf8; stroke-width: 2.5; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1200" height="420" fill="#0b1220"/>
  <text x="40" y="48" class="title">End-to-End Pothole Severity Pipeline</text>

  <rect x="40" y="88" width="195" height="94" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="58" y="124" class="label">1. Input Image</text>
  <text x="58" y="147" class="hint">Road frame upload</text>

  <rect x="280" y="88" width="220" height="94" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="298" y="124" class="label">2. YOLO Segmentation</text>
  <text x="298" y="147" class="hint">Pothole mask extraction</text>

  <rect x="545" y="88" width="235" height="94" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="563" y="124" class="label">3. Depth Estimation</text>
  <text x="563" y="147" class="hint">Depth-Anything-V2 map</text>

  <rect x="825" y="88" width="335" height="94" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="843" y="124" class="label">4. Feature + Classifier Layer</text>
  <text x="843" y="147" class="hint">Rule-based + ML voting</text>

  <rect x="200" y="248" width="310" height="108" rx="12" fill="#10233f" stroke="#0ea5e9"/>
  <text x="220" y="288" class="label">5. FastAPI Response</text>
  <text x="220" y="313" class="hint">Severity, overlays, and schematic JSON</text>

  <rect x="650" y="248" width="380" height="108" rx="12" fill="#18312a" stroke="#22c55e"/>
  <text x="670" y="288" class="label">6. React Dashboard</text>
  <text x="670" y="313" class="hint">Detection view + model insights and charts</text>

  <path d="M235 135 L280 135" class="arrow"/>
  <path d="M500 135 L545 135" class="arrow"/>
  <path d="M780 135 L825 135" class="arrow"/>
  <path d="M992 182 L860 248" class="arrow"/>
  <path d="M510 302 L650 302" class="arrow"/>
</svg>
